name: Ecological Dataset Freshness Monitor

on:
  schedule:
    # Runs every 6 hours. Adjust to taste -- more frequent runs catch outages
    # faster but hit the upstream APIs more often.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write   # needed to commit the updated state/status.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run freshness monitor
        id: monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python monitor.py
        continue-on-error: true   # so we still commit status.json + can inspect the run even when issues are found

      - name: Regenerate README status table
        run: python dashboard/render_status.py

      - name: Commit updated status
        run: |
          git config user.name "eco-dataset-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/status.json state/schema_baseline.json README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update dataset health status [automated]"
          git push

      - name: Fail the job if issues were found
        if: steps.monitor.outcome == 'failure'
        run: exit 1
